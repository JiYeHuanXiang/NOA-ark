# noa-ark dsh bundle patch
#
# 通过 `dsh plugin --profile <name> add link:<this repo>` 安装后，
# dsh 启动时会插入 noa-ark 行。
#
# 工作方式：旁路已安装的 @tencent-connect/dsh-qqbot 的 QQBot 实例，
# 用同一凭据对外提供 OneBot v11 正向/反向 WebSocket。
#
# 回复隔离：默认 auto —— 有 OneBot 客户端在线时，dsh-qqbot 不处理入站消息，
# 避免 dsh 与外接 OneBot 程序同时回复。takeover.isolation 可选 auto/always/off。
- insert:
    - id: noa-ark
      name: 'noa-ark/dsh'
      config:
        idMode: mapped
        passiveOverflow: fail
        onebot:
          enable: true
          accessToken: ''
          wsPort: 7791
          wsPath: /ws
          reverseUrls: []
        takeover:
          appId: ''
          autoAckInteraction: false
          isolation: auto
          retryDelayMs: 30000
